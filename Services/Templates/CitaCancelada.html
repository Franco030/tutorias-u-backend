<h1 style="margin:0 0 8px;font-size:22px;line-height:1.3;font-weight:600;color:#111827;">{{Encabezado}}</h1>
<p style="margin:0 0 24px;color:#4b5563;">Hola, {{DestinatarioNombre}}. {{Descripcion}}</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;border-top:1px solid #e5e7eb;">
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;width:120px;vertical-align:top;">{{RolContraparte}}</td>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;font-weight:600;">{{ContraparteNombre}}</td>
  </tr>
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;vertical-align:top;">Materia</td>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;font-weight:600;">{{Materia}}</td>
  </tr>
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;vertical-align:top;">Fecha</td>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;font-weight:600;">{{Fecha}}</td>
  </tr>
  <tr>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;color:#6b7280;vertical-align:top;">Motivo</td>
    <td style="padding:12px 0;border-bottom:1px solid #e5e7eb;">{{#Motivo}}{{Motivo}}{{/Motivo}}{{#SinMotivo}}<span style="color:#6b7280;">No se indicó un motivo.</span>{{/SinMotivo}}</td>
  </tr>
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="boton">
  <tr>
    <td style="border-radius:4px;background-color:#456ad1;">
      <a href="{{UrlBoton}}" style="display:inline-block;padding:12px 24px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:4px;">{{TextoBoton}}</a>
    </td>
  </tr>
</table>
